<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>হিসাব খাতা — ব্যক্তিগত লেনদেন ট্র্যাকার</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="lock-screen" class="lock-screen hidden">
    <form id="lock-form" class="lock-card">
      <span class="brand-mark lock-mark">হি</span>
      <h1>হিসাব খাতা লক করা আছে</h1>
      <p class="lock-sub">চালিয়ে যেতে পাসওয়ার্ড দিন</p>
      <label for="lock-password" class="sr-only">পাসওয়ার্ড</label>
      <input type="password" id="lock-password" placeholder="পাসওয়ার্ড" autocomplete="current-password" required>
      <button type="submit" id="lock-submit" class="btn-primary">খাতা খুলুন</button>
      <p id="lock-error" class="lock-error hidden"></p>
    </form>
  </div>

  <div id="app-shell" class="app-shell hidden">
    <div class="topbar">
      <button id="menu-toggle" aria-label="মেনু খুলুন">☰</button>
      <strong>হিসাব খাতা</strong>
    </div>

    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-mark">হি</span>
        <h1>হিসাব খাতা</h1>
        <p>ব্যক্তিগত লেনদেনের ডিজিটাল খাতা</p>
      </div>
      <nav class="nav" id="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <span>Google Sheet-এ সংরক্ষিত</span>
        <button id="logout-btn" class="logout-btn" type="button">লগ আউট</button>
      </div>
    </aside>

    <main class="main-wrap">
      <div id="main-content"></div>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
